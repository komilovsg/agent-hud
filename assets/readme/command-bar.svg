<title id="t">Command bar</title>
<desc id="d">Drawn command bar over a desktop. The first bar has the Assistant chip, a typed command and the hint Return sends, Shift-Return adds a line, Esc closes. The second bar targets a session that is still working and says Return queues this, Command-Return interrupts and sends. Next to them is the Assistant card with the reply.</desc>
