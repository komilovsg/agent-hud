<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">How it works</title>
<desc id="d">Flow: Claude Code calls agenthud-hook, which talks over a Unix socket to Agent HUD. The decision goes back to Claude Code. Only your user can open the socket and there is no network.</desc>
