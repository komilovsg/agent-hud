<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="460" viewBox="0 0 1200 460" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Two permission requests</title>
<desc id="d">Two drawn permission cards. The ordinary request for npm install zod has a highlighted Allow button, Deny and an Always menu. The red-flagged request for git push origin main is tinted red, names the rule, has no Always menu and no highlighted Allow. Both have a button to answer in the editor and a countdown.</desc>
