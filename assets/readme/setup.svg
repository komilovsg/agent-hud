<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="970" viewBox="0 0 1200 970" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Setup window</title>
<desc id="d">A drawn setup window with mixed statuses. Needed now: Connection to Claude Code granted, Automation to check, Notifications not granted. For what is coming: Accessibility granted but not used yet, Screen Recording and Full Disk Access not granted. The footer reads 1 of 6 allowed, limited, with a Done button. Callouts say each permission has a purpose, nothing is requested without a click, and skipped permissions only leave their feature off.</desc>
