<text x="152" y="658" font-size="22" font-weight="600" fill="#FFFFFF" fill-opacity="0.92" text-anchor="start">Screen Recording</text>
<rect x="351.6" y="636" width="138.6" height="28" rx="6" fill="#FBBF24" fill-opacity="0.2"/>
<text x="420.90000000000003" y="656" font-size="18" font-weight="600" fill="#FBBF24" fill-opacity="1" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">NOT GRANTED</text>
<text x="152" y="690" font-size="18" font-weight="400" fill="#FFFFFF" fill-opacity="0.6" text-anchor="start">Lets agents see the screen.</text>
