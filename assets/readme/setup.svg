<text x="824" y="150" font-size="22" font-weight="700" fill="#FFFFFF" fill-opacity="0.92" text-anchor="start">Purpose and status</text>
<text x="824" y="186" font-size="20" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="start">Every permission says what it</text>
<text x="824" y="214" font-size="20" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="start">is for and shows whether it is</text>
<text x="824" y="242" font-size="20" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="start">granted.</text>
<rect x="800" y="316" width="4" height="150" rx="2" fill="#338EF7" fill-opacity="1"/>
<text x="824" y="346" font-size="22" font-weight="700" fill="#FFFFFF" fill-opacity="0.92" text-anchor="start">Nothing without a click</text>
<text x="824" y="382" font-size="20" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="start">Allow… asks macOS for that one</text>
<text x="824" y="410" font-size="20" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="start">permission. The window never</text>
<text x="824" y="438" font-size="20" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="start">requests anything on its own.</text>
<rect x="800" y="512" width="4" height="150" rx="2" fill="#338EF7" fill-opacity="1"/>
<text x="824" y="542" font-size="22" font-weight="700" fill="#FFFFFF" fill-opacity="0.92" text-anchor="start">Skip what you do not need</text>
<text x="824" y="578" font-size="20" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="start">A permission you skip leaves</text>
<text x="824" y="606" font-size="20" font-weight="400" fill="#FFFFFF" fill-opacity="0.8" text-anchor="start">only its own feature off.</text>
