<title id="t">Voice</title>
<desc id="d">Drawn command bar while the hotkey is held, with a level meter, the heard text and the line Listening, release the key to finish, Esc cancels; below it the same bar after release with Sending, Esc to cancel, any key to edit. On the right is the Voice settings section with language, send after speaking, speak replies, voice engine, voice pickers with Preview, and speaking speed.</desc>
