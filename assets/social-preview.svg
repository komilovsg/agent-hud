<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="t d" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
<title id="t">Agent HUD</title>
<desc id="d">Agent HUD, a floating macOS HUD for Claude Code sessions. Left: title, tagline and three feature pills. Right: a drawn mock-up with three session tokens (green, amber, red status) and a red-flagged permission card for git push origin main with Allow and Deny buttons.</desc>
